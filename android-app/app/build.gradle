plugins {
    id 'com.android.application'
}

android {
    namespace 'com.alexking.skillrpg'
    compileSdk 35

    defaultConfig {
        applicationId 'com.alexking.skillrpg'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '0.1-main'
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
