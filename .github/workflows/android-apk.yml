name: Build Android APK

on:
  push:
    branches:
      - build/android-apk-20260822
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install web dependencies
        run: npm ci

      - name: Run regression tests
        run: npm test

      - name: Build web app for local Android assets
        env:
          STATIC_PREVIEW: "true"
        run: npm run build

      - name: Copy web build into Android assets
        run: |
          rm -rf android-app/app/src/main/assets/www
          mkdir -p android-app/app/src/main/assets/www
          cp -R dist/. android-app/app/src/main/assets/www/

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle -p android-app assembleDebug --stacktrace

      - name: Prepare APK
        run: cp android-app/app/build/outputs/apk/debug/app-debug.apk Skill-RPG-main-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: skill-rpg-main-apk
          path: Skill-RPG-main-debug.apk
          if-no-files-found: error
