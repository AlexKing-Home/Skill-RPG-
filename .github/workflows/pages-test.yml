name: Publish static test build

on:
  push:
    branches:
      - main
      - feature/starter-kit-20260929
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: static-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run regression tests
        run: npm test

      - name: Build React app
        env:
          STATIC_PREVIEW: "true"
        run: npm run build

      - name: Publish preview-build branch
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Preview build ${GITHUB_SHA}"
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            PREVIEW_BRANCH="preview-build"
          else
            PREVIEW_BRANCH="starter-kit-preview-build"
          fi
          git branch -M "${PREVIEW_BRANCH}"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin "${PREVIEW_BRANCH}"
