name: Enhance RPG images

on:
  push:
    branches:
      - rebuild/character-entry-clean
    paths:
      - scripts/enhance-images.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enhance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: rebuild/character-entry-clean
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image tools
        run: python -m pip install --disable-pip-version-check pillow pillow-avif-plugin opencv-python-headless numpy

      - name: Enhance approved assets
        run: python scripts/enhance-images.py

      - name: Commit enhanced binaries
        shell: bash
        run: |
          if git diff --quiet -- public/skins public/ui; then
            echo "No image changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- public/skins/male-swordsman.jpg \
            public/skins/male-spearman.jpg \
            public/skins/male-assassin.jpg \
            public/skins/male-archer.jpg \
            public/skins/female-swordsman.jpg \
            public/skins/female-spearman.avif \
            public/skins/female-assassin.avif \
            public/skins/female-archer.avif \
            public/ui/world-map-reference-v2.webp \
            public/ui/world-map.webp \
            public/ui/location-map-reference-v2.webp \
            public/ui/location-map.webp
          git commit -m "assets: upscale RPG artwork"
          git push origin HEAD:rebuild/character-entry-clean
