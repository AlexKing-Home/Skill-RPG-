name: Prettier auto-format

on:
  push:

permissions:
  contents: write

concurrency:
  group: prettier-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prettier:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out pushed branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install repository dependencies
        run: npm install

      - name: Run one-time CSS consolidation
        shell: bash
        run: |
          set -euo pipefail
          node scripts/consolidate-css-once.mjs
          npx --no-install prettier --write --ignore-unknown src tests README.md docs package.json
          printf '%s\n' \
            node_modules \
            dist \
            coverage \
            'src/data/**/*Chunks*/**' > .prettierignore
          rm -f scripts/consolidate-css-once.mjs
          rm -f .github/workflows/css-consolidation.yml
          git checkout origin/main -- .github/workflows/prettier.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: consolidate CSS architecture"
          git push origin "HEAD:${GITHUB_REF_NAME}"
