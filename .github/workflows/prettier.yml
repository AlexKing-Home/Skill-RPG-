name: Prettier auto-format

on:
  push:

permissions:
  contents: write

concurrency:
  group: prettier-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prettier:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out pushed branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Format project
        run: npm run format
      - name: Commit formatting when needed
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.js' '*.jsx' '*.mjs' '*.json' '*.css' '*.md' '*.yml' '*.yaml' '*.html' || true
          git commit -m "style: auto-format with Prettier"
          git push origin "HEAD:${GITHUB_REF_NAME}"
